<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي الترانزستور والبوابات</title>
<style>
  /* التنسيقات العامة - Dark Mode / Tech */
  :root {
    --bg: #050810; --panel: #0e1424; --panel2: #141b2e;
    --border: #1e2a44; --text: #e2e8f0; --dim: #7a8ba0;
    --cyan: #06b6d4; --green: #10b981; --green-b: #2eff9a;
    --red: #ef4444; --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 40px;
    background-image: linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  
  /* الترويسة والتبويبات */
  header { position: sticky; top: 0; z-index: 100; background: rgba(5,8,16,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 12px; text-align: center; }
  h1 { font-size: 1.2rem; color: var(--cyan); margin-bottom: 8px; }
  .tabs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .tab-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--dim); font-size: 0.8rem; font-weight: bold; cursor: pointer; }
  .tab-btn.active { background: var(--cyan); color: #fff; border-color: var(--cyan); box-shadow: 0 0 10px rgba(6,182,212,0.4); }

  /* الأقسام */
  .section { display: none; max-width: 1200px; margin: 16px auto; padding: 0 12px; }
  .section.active { display: block; }
  
  /* شبكة البوابات */
  .gates-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
  .gate-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
  .gate-name { font-size: 1.1rem; font-weight: bold; color: var(--cyan); text-align: center; margin-bottom: 10px; font-family: monospace; }
  
  /* أزرار الإدخال والليد */
  .inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .in-btn { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--dim); font-weight: bold; cursor: pointer; font-family: monospace; }
  .in-btn.on { background: rgba(6,182,212,0.15); border-color: var(--cyan); color: var(--cyan); }
  .led-box { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--panel2); padding: 10px; border-radius: 8px; margin-bottom: 12px; }
  .led { width: 20px; height: 20px; border-radius: 50%; transition: all 0.2s; }
  .led.on { background: var(--green-b); box-shadow: 0 0 15px var(--green-b); }
  .led.off { background: #3a1818; border: 1px solid #5a2424; }
  .led-text { font-family: monospace; font-size: 0.85rem; font-weight: bold; }
  .led-text.on { color: var(--green-b); }
  .led-text.off { color: var(--dim); }

  /* جدول الحقيقة */
  table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.8rem; margin-bottom: 12px; }
  th, td { padding: 6px; border: 1px solid var(--border); text-align: center; }
  th { background: var(--panel2); color: var(--dim); }
  tr.active td { background: rgba(6,182,212,0.2); color: var(--cyan); font-weight: bold; }
  tr.active td.out-1 { background: rgba(46,255,154,0.2); color: var(--green-b); }
  tr.active td.out-0 { background: rgba(239,68,68,0.15); color: var(--red); }

  /* 💡 صندوق الفائدة (هنا يظهر الشرح) */
  .usage-box {
    background: rgba(6,182,212,0.08); border-right: 4px solid var(--cyan);
    padding: 10px; border-radius: 6px; margin-top: auto; /* لضمان بقائه في الأسفل */
  }
  .usage-title { color: var(--cyan); font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  .usage-desc { color: var(--text); font-size: 0.75rem; line-height: 1.5; opacity: 0.9; }

  /* الترانزستور */
  .transistor-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .transistor-card { grid-template-columns: 1fr; } }
  .svg-container { background: var(--panel2); border-radius: 10px; padding: 10px; display: flex; justify-content: center; }
  .slider-box { margin-bottom: 15px; }
  .slider-box label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; }
  input[type=range] { width: 100%; height: 6px; -webkit-appearance: none; background: var(--border); border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--cyan); cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>⚡ مختبر الإلكترونيات الرقمية</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('gates')">البوابات المنطقية</button>
    <button class="tab-btn" onclick="switchTab('transistor')">الترانزستور (NPN)</button>
  </div>
</header>

<main>
  <!-- قسم البوابات -->
  <section id="tab-gates" class="section active">
    <div class="gates-grid" id="gatesGrid"></div>
  </section>

  <!-- قسم الترانزستور -->
  <section id="tab-transistor" class="section">
    <div class="transistor-card">
      <div class="svg-container">
        <svg id="transistorSvg" viewBox="0 0 220 220" style="width:100%;max-width:250px;"></svg>
      </div>
      <div>
        <div class="slider-box">
          <label><span>تيار القاعدة (I_B)</span><span id="ibLabel">0 μA</span></label>
          <input type="range" id="ibSlider" min="0" max="200" value="0" step="5">
        </div>
        <div class="usage-box" style="margin-top:20px;">
          <div class="usage-title">💡 فائدة الترانزستور:</div>
          <div class="usage-desc">يعمل كمفتاح إلكتروني يتحكم في تيار كبير باستخدام تيار صغير جداً. يُستخدم في تضخيم الإشارات، وبناء المعالجات، والتحكم في المحركات والمصابيح.</div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
// بيانات البوابات مع شرح الفائدة
const GATES = [
  { id: 'AND', inputs: 2, fn: (a,b) => (a&&b)?1:0, usage: 'تُستخدم في دوائر الأمان، حيث يجب أن يتحقق شرطان معاً (مثل إدخال البطاقة ورقم المرور) لفتح القفل.' },
  { id: 'OR', inputs: 2, fn: (a,b) => (a||b)?1:0, usage: 'تُستخدم في أنظمة الإنذار، حيث يكفي أن يتحقق شرط واحد (مثل استشعار دخان أو حرارة) لتفعيل الإنذار.' },
  { id: 'NOT', inputs: 1, fn: (a) => a?0:1, usage: 'تُستخدم لعكس الإشارة، مثل إضاءة مصباح تلقائياً عند غياب الضوء (ليلاً).' },
  { id: 'NAND', inputs: 2, fn: (a,b) => (a&&b)?0:1, usage: 'بوابة شاملة. تُستخدم بكثرة في تصنيع الذاكرة (Flash) والمعالجات لأنها أسهل وأرخص في التصنيع.' },
  { id: 'NOR', inputs: 2, fn: (a,b) => (a||b)?0:1, usage: 'بوابة شاملة. تُستخدم في دوائر التحكم بالوقت وأنظمة الأمان المعقدة.' },
  { id: 'XOR', inputs: 2, fn: (a,b) => a!==b?1:0, usage: 'تُستخدم في دوائر الجمع الرياضي داخل المعالج (ALU)، وفي كشف الأخطاء أثناء نقل البيانات.' },
  { id: 'XNOR', inputs: 2, fn: (a,b) => a===b?1:0, usage: 'تُستخدم في دوائر المقارنة، للتحقق مما إذا كان الرقمان المدخلان متساويان أم لا.' }
];

const state = {};
GATES.forEach(g => state[g.id] = new Array(g.inputs).fill(0));

// بناء البطاقات
function build() {
  const grid = document.getElementById('gatesGrid');
  GATES.forEach(g => {
    const card = document.createElement('div');
    card.className = 'gate-card';
    
    // أزرار الإدخال
    let inputsHtml = '';
    for(let i=0; i<g.inputs; i++) {
      inputsHtml += `<button class="in-btn" id="btn-${g.id}-${i}" onclick="toggle('${g.id}',${i})">${String.fromCharCode(65+i)} = 0</button>`;
    }

    // جدول الحقيقة
    let tableHtml = `<table id="tbl-${g.id}"><tr><th>A</th>${g.inputs===2?'<th>B</th>':''}<th>Y</th></tr>`;
    const combos = g.inputs===1 ? [[0],[1]] : [[0,0],[0,1],[1,0],[1,1]];
    combos.forEach(c => {
      const y = g.fn(...c);
      tableHtml += `<tr data-in="${c.join(',')}"><td>${c[0]}</td>${g.inputs===2?`<td>${c[1]}</td>`:''}<td class="${y?'out-1':'out-0'}">${y}</td></tr>`;
    });
    tableHtml += `</table>`;

    card.innerHTML = `
      <div class="gate-name">${g.id}</div>
      <div class="inputs">${inputsHtml}</div>
      <div class="led-box">
        <div class="led off" id="led-${g.id}"></div>
        <span class="led-text off" id="txt-${g.id}">Y = 0</span>
      </div>
      ${tableHtml}
      <div class="usage-box">
        <div class="usage-title">💡 الفائدة:</div>
        <div class="usage-desc">${g.usage}</div>
      </div>
    `;
    grid.appendChild(card);
    update(g.id);
  });
}

function toggle(id, idx) {
  state[id][idx] = state[id][idx] ? 0 : 1;
  update(id);
}

function update(id) {
  const g = GATES.find(x => x.id === id);
  const st = state[id];
  const out = g.fn(...st);

  // تحديث الأزرار
  st.forEach((v, i) => {
    const b = document.getElementById(`btn-${id}-${i}`);
    b.textContent = `${String.fromCharCode(65+i)} = ${v}`;
    b.className = 'in-btn ' + (v ? 'on' : '');
  });

  // تحديث الليد
  const led = document.getElementById('led-'+id);
  const txt = document.getElementById('txt-'+id);
  led.className = 'led ' + (out ? 'on' : 'off');
  txt.className = 'led-text ' + (out ? 'on' : 'off');
  txt.textContent = `Y = ${out} (${out?'ON':'OFF'})`;

  // إبراز الصف النشط
  document.getElementById('tbl-'+id).querySelectorAll('tr').forEach(tr => {
    if(!tr.dataset.in) return;
    const ins = tr.dataset.in.split(',').map(Number);
    tr.className = ins.every((v, i) => v === st[i]) ? 'active' : '';
  });
}

// الترانزستور
function drawTransistor() {
  document.getElementById('transistorSvg').innerHTML = `
    <circle cx="110" cy="110" r="80" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
    <line x1="85" y1="60" x2="85" y2="160" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="110" x2="85" y2="110" stroke="#06b6d4" stroke-width="2"/>
    <line x1="30" y1="110" x2="85" y2="110" stroke="#22d3ee" stroke-width="2"/>
    <line x1="85" y1="85" x2="130" y2="60" stroke="#06b6d4" stroke-width="2"/>
    <line x1="130" y1="60" x2="130" y2="20" stroke="#06b6d4" stroke-width="2"/>
    <line x1="85" y1="135" x2="130" y2="160" stroke="#06b6d4" stroke-width="2"/>
    <line x1="130" y1="160" x2="130" y2="200" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="115,150 103,148 107,141" fill="#06b6d4"/>
    <text x="15" y="105" fill="#06b6d4" font-family="monospace">B</text>
    <text x="140" y="20" fill="#06b6d4" font-family="monospace">C</text>
    <text x="140" y="210" fill="#06b6d4" font-family="monospace">E</text>
  `;
}

document.getElementById('ibSlider').addEventListener('input', function() {
  const ib = parseFloat(this.value);
  document.getElementById('ibLabel').textContent = ib + ' μA';
  const ic = ib * 100 * 1e-6 * 1000; // ib * beta
  const led = document.getElementById('led-trans');
  // الكود البسيط للمحاكاة
});

// التبويبات
function switchTab(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
}

build();
drawTransistor();
</script>
</body>
</html>
